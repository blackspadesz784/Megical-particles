<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Controlled 3D Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #video-input { position: absolute; top: 10px; left: 10px; width: 160px; height: 120px; z-index: 2; transform: scaleX(-1); border: 2px solid #333; opacity: 0.5; border-radius: 8px; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; z-index: 10; pointer-events: none; text-align: center; }
        #instructions { position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.7); z-index: 2; pointer-events: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loading">Loading Computer Vision Models...<br><span style="font-size:14px; color:#aaa">Please allow camera access</span></div>
    
    <div id="instructions">
        <h3>Gestures:</h3>
        <p>☝️ 1 Finger: Sphere</p>
        <p>✌️ 2 Fingers: Heart</p>
        <p>🤟 3 Fingers: Saturn</p>
        <p>🖖 4 Fingers: Flower</p>
        <p>🖐️ Open Hand: Fireworks</p>
        <p>✊ Fist: Collapse</p>
        <p>🤏 Pinch: Change Color</p>
    </div>

    <video id="video-input" autoplay playsinline></video>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0';

        const PARTICLE_COUNT = 8000;
        const PARTICLE_SIZE = 0.15;
        const MORPH_SPEED = 0.08;

        let scene, camera, renderer, particles, geometry, material;
        let targetPositions = new Float32Array(PARTICLE_COUNT * 3); 
        let currentShape = 'sphere';
        let handLandmarker = undefined;
        let lastVideoTime = -1;
        let hue = 0.6; 

        const video = document.getElementById('video-input');
        const loadingScreen = document.getElementById('loading');

        async function init() {
            initThreeJS();
            await initMediaPipe();
            createParticles();
            setShape('sphere'); 
            animate();
        }

        function initThreeJS() {
            scene = new THREE.Scene();

            scene.fog = new THREE.FogExp2(0x000000, 0.03);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        async function initMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
            );
            
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: "user" } 
                });
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadeddata = () => {
                        loadingScreen.classList.add('hidden');
                        resolve();
                    };
                });
            }
        }

        function createParticles() {
            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 50;
                colors[i] = 1.0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');

            material = new THREE.PointsMaterial({
                size: PARTICLE_SIZE,
                vertexColors: true,
                map: sprite,
                alphaTest: 0.5,
                transparent: true,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function getPointOnSphere(i) {
            const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
            const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
            const r = 6;
            return {
                x: r * Math.cos(theta) * Math.sin(phi),
                y: r * Math.sin(theta) * Math.sin(phi),
                z: r * Math.cos(phi)
            };
        }

        function getPointOnHeart(i) {

            const t = (i / PARTICLE_COUNT) * Math.PI * 2;
            const r = 0.3; 

            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = Math.sin(t * 10) * 2; 
            return { x: x * r, y: y * r, z: z * r };
        }

        function getPointOnSaturn(i) {

            if (i < PARTICLE_COUNT * 0.7) {

                const p = getPointOnSphere(i);
                return { x: p.x * 0.6, y: p.y * 0.6, z: p.z * 0.6 };
            } else {

                const angle = i * 0.1;
                const r = 6 + Math.random() * 3;
                return {
                    x: Math.cos(angle) * r,
                    y: (Math.random() - 0.5) * 0.5, 
                    z: Math.sin(angle) * r
                };
            }
        }

        function getPointOnFlower(i) {
            const angle = (i / PARTICLE_COUNT) * Math.PI * 20; 
            const rBase = 5;
            const rVar = Math.sin((i / PARTICLE_COUNT) * Math.PI * 5) * 3; 
            const r = rBase + rVar;
            const y = (i / PARTICLE_COUNT - 0.5) * 5;
            return {
                x: Math.cos(angle) * r,
                y: y,
                z: Math.sin(angle) * r
            };
        }

        function getPointFireworks(i) {

            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            const r = 4 + Math.random() * 8; 
            return {
                x: r * Math.sin(phi) * Math.cos(theta),
                y: r * Math.sin(phi) * Math.sin(theta),
                z: r * Math.cos(phi)
            };
        }

        function setShape(type) {
            currentShape = type;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let p;
                if (type === 'sphere') p = getPointOnSphere(i);
                else if (type === 'heart') p = getPointOnHeart(i);
                else if (type === 'saturn') p = getPointOnSaturn(i);
                else if (type === 'flower') p = getPointOnFlower(i);
                else if (type === 'fireworks') p = getPointFireworks(i);
                else if (type === 'collapse') p = {x:0, y:0, z:0}; // Fist
                
                targetPositions[i * 3] = p.x;
                targetPositions[i * 3 + 1] = p.y;
                targetPositions[i * 3 + 2] = p.z;
            }
        }

        function countFingers(landmarks) {
            const tips = [8, 12, 16, 20]; 
            const pip = [6, 10, 14, 18]; 
            
            let count = 0;

            for(let i=0; i<4; i++) {
                if(landmarks[tips[i]].y < landmarks[pip[i]].y) count++;
            }

            if (landmarks[4].y < landmarks[2].y) count++; 

            return count;
        }

        function isFist(landmarks) {

            const tips = [8, 12, 16, 20];
            const pips = [6, 10, 14, 18];
            let folded = 0;
            for(let i=0; i<4; i++) {
                if(landmarks[tips[i]].y > pips[i].y) folded++;
            }
            return folded === 4;
        }

        function getPinchDistance(landmarks) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const d = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) + 
                Math.pow(thumbTip.y - indexTip.y, 2)
            );
            return d;
        }

        function animate() {
            requestAnimationFrame(animate);

            let detectedShape = currentShape;
            
            if (handLandmarker && video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const result = handLandmarker.detectForVideo(video, performance.now());

                if (result.landmarks && result.landmarks.length > 0) {
                    const lm = result.landmarks[0]; 

                    const handX = lm[9].x; 
                    const handY = lm[9].y;

                    const targetRotY = (handX - 0.5) * 4;
                    const targetRotX = (handY - 0.5) * 4;
                    particles.rotation.y += (targetRotY - particles.rotation.y) * 0.1;
                    particles.rotation.x += (targetRotX - particles.rotation.x) * 0.1;

                    const pinchDist = getPinchDistance(lm);
                    if (pinchDist < 0.05) {

                        hue += 0.01;
                        if(hue > 1) hue = 0;
                    }

                    if (isFist(lm)) {
                        if (currentShape !== 'collapse') setShape('collapse');
                    } else {
                        const fingers = countFingers(lm);
                        
                        if (fingers === 1 && currentShape !== 'sphere') setShape('sphere');
                        else if (fingers === 2 && currentShape !== 'heart') setShape('heart');
                        else if (fingers === 3 && currentShape !== 'saturn') setShape('saturn');
                        else if (fingers === 4 && currentShape !== 'flower') setShape('flower');
                        else if (fingers === 5 && currentShape !== 'fireworks') setShape('fireworks');
                    }
                } else {

                    particles.rotation.y += 0.002;
                }
            }

            const positions = geometry.attributes.position.array;
            const colors = geometry.attributes.color.array;

            const colorObj = new THREE.Color();
            colorObj.setHSL(hue, 1.0, 0.5);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                const noise = Math.sin(Date.now() * 0.001 + i) * 0.02;

                positions[ix] += (targetPositions[ix] - positions[ix]) * MORPH_SPEED;
                positions[iy] += (targetPositions[iy] - positions[iy]) * MORPH_SPEED;
                positions[iz] += (targetPositions[iz] - positions[iz]) * MORPH_SPEED;

                colors[ix] = colorObj.r;
                colors[iy] = colorObj.g;
                colors[iz] = colorObj.b;
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            renderer.render(scene, camera);
        }

        init();

    </script>
</body>
</html>
